name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      api_reference_snapshot:
        description: Exact API reference snapshot tag; latest published snapshot when omitted
        required: false
        type: string
      mixedbread_scope:
        description: Mixedbread content scope to synchronize
        required: true
        default: markdown
        type: choice
        options:
          - markdown
          - api-reference
          - all
      force_full_build:
        description: Discard the Astro incremental build cache and re-render every page
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      website-ref: ${{ github.sha }}
      api-reference-snapshot: ${{ inputs.api_reference_snapshot || '' }}
      mixedbread-scope: ${{ inputs.mixedbread_scope || 'markdown' }}
      cloudflare-traffic-mode: ${{ vars.CLOUDFLARE_TRAFFIC_MODE || 'workers-dev' }}
      force-full-build: ${{ inputs.force_full_build || false }}
    secrets: inherit
