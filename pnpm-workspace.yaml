packages:
  - apps/*
  - packages/*

patchedDependencies:
  "@alchemy.run/frontend-frameworks@2.0.0-beta.85": patches/@alchemy.run__frontend-frameworks@2.0.0-beta.85.patch
  astro-tweet@0.0.6: patches/astro-tweet.patch

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

allowBuilds:
  "@mixedbread/cli": true
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.1.2"
  - "@effect/doctest@4.1.2"
  - "@effect/monaco-editor@0.0.3"
  - "@effect/platform-browser@4.1.2"
  - "@effect/platform-node-shared@4.1.2"
  - "@effect/platform-node@4.1.2"
  - effect@4.1.2
  - "@effect/sql-d1@4.1.2"
  - "@effect/sql-sqlite-do@4.1.2"
  - "@effect/vitest@4.1.2"
  - "@foldkit/devtools@0.170.0"
  - "@foldkit/ui@0.170.0"
  - foldkit@0.170.0
  - "@foldkit/vite-plugin@0.29.0"

catalogMode: manual

update:
  ignoreDeps:
    - typescript

catalog:
  "@cloudflare/puppeteer": ^1.3.0
  "@cloudflare/workers-types": 5.20260812.1
  "@resvg/resvg-wasm": ^2.6.2
  "@types/node": ^26.6.3
  mdast-util-find-and-replace: ^3.0.2
  # 0.33+ statically imports harfbuzzjs, whose loader reads `self.location`
  # and fetches `hb.wasm` at runtime. Neither works on Workers, so every
  # `/og/*.png` request fails. Check satori/standalone before bumping.
  satori: ~0.32.0
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

catalogs:
  alchemy:
    alchemy: 2.0.0-beta.85
    "@alchemy.run/cloudflare": 2.0.0-beta.85
    "@alchemy.run/github": 2.0.0-beta.85
    "@alchemy.run/frontend-frameworks": 2.0.0-beta.85
  effect:
    effect: 4.1.2
    "@effect/atom-react": 4.1.2
    "@effect/monaco-editor": ^0.0.3
    "@effect/platform-browser": 4.1.2
    "@effect/platform-node": 4.1.2
    "@effect/doctest": 4.1.2
    "@effect/vitest": 4.1.2

overrides:
  "astro-tweet>date-fns": "-"
  "@effect/sql-d1": 4.1.2
  "@effect/sql-sqlite-do": 4.1.2
  "@effect/vitest": 4.1.2
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
