name: Vercel Production Deployment

on:
  workflow_dispatch:
    inputs:
      api_reference_snapshot:
        description: Exact API reference snapshot tag; latest published snapshot when omitted
        required: false
        type: string
      mixedbread_scope:
        description: Mixedbread content scope to synchronize
        required: true
        default: markdown
        type: choice
        options:
          - markdown
          - api-reference
          - all
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/deploy
        with:
          website-ref: ${{ github.sha }}
          api-reference-snapshot: ${{ inputs.api_reference_snapshot || '' }}
          mixedbread-scope: ${{ inputs.mixedbread_scope || 'markdown' }}
          mxbai-api-key: ${{ secrets.MXBAI_API_KEY }}
          mxbai-vector-store-id: ${{ secrets.MXBAI_VECTOR_STORE_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
