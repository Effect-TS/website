name: Requested Preview Deployment
run-name: "Requested Preview for PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions: {}

# The event's values, the same in every job and on every rerun. The head SHA is
# the commit a reviewer approves, and nothing below resolves a newer one.
env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  # Keeps the gate closed unless this PR lacks an automatic preview AND the
  # `fork` environment already has required reviewers configured (preventing
  # GitHub from auto-creating an unprotected environment).
  check-gate:
    if: github.event.action != 'closed' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Check eligibility and approval gate protection
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request

            // The rule preview.yml uses to give a PR an automatic preview.
            const hasAutomaticPreview = async () => {
              if (pr.head.repo?.full_name !== pr.base.repo.full_name) return false
              if (pr.user.id === 349016676) return true
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo,
                  username: pr.user.login,
                })
                return ["write", "maintain", "admin"].includes(data.permission)
              } catch (error) {
                if (error.status !== 404) throw error
                return false
              }
            }
            if (await hasAutomaticPreview()) {
              core.info(`PR #${pr.number} is handled by automatic Preview Deployment; skipping.`)
              return
            }

            let env
            try {
              const { data } = await github.rest.repos.getEnvironment({
                ...context.repo,
                environment_name: "fork",
              })
              env = data
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (!env?.protection_rules?.some((rule) => rule.type === "required_reviewers" && rule.reviewers?.length)) {
              core.warning(
                'Environment "fork" is missing or has no required reviewers; keeping the requested preview approval gate closed.',
              )
              return
            }

            core.setOutput("eligible", "true")
            core.info(`PR #${pr.number} at ${pr.head.sha} is awaiting deployment approval on environment "fork".`)

  approval-gate:
    name: "Approve preview for PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})"
    needs: check-gate
    if: needs.check-gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    environment: fork
    concurrency:
      group: requested-preview-approval-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
    outputs:
      # Set only once the approval is recorded, so later jobs run on it alone.
      deployment_id: ${{ steps.approve.outputs.deployment_id }}
    steps:
      - name: Record approved commit and start preview deployment
        id: approve
        uses: actions/github-script@v8
        with:
          script: |
            // check-gate ran before the approval, and a rerun of this job reuses its result.
            const { data: env } = await github.rest.repos.getEnvironment({
              ...context.repo,
              environment_name: "fork",
            })
            if (!env.protection_rules?.some((rule) => rule.type === "required_reviewers" && rule.reviewers?.length)) {
              throw new Error('Environment "fork" lost its required reviewers; aborting preview.')
            }

            const prNumber = context.payload.pull_request.number
            const headSha = context.payload.pull_request.head.sha
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber,
            })
            if (pr.state !== "open" || pr.base.ref !== "main") {
              core.info(`PR #${prNumber} is now ${pr.state} targeting ${pr.base.ref}; skipping preview.`)
              return
            }
            if (pr.head.sha !== headSha) {
              core.warning(
                `PR #${prNumber} head moved from approved commit ${headSha} to ${pr.head.sha}; skipping stale approval.`,
              )
              return
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: headSha,
              environment: "Requested Preview",
              description: `Requested preview for PR #${prNumber}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
              payload: { pull_request: prNumber },
            })

            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: "in_progress",
              environment: "Requested Preview",
              log_url: runUrl,
              description: `Building preview for ${headSha.slice(0, 7)}`,
              auto_inactive: false,
            })

            core.setOutput("deployment_id", String(deployment.id))
            core.info(
              `Approved requested preview for PR #${prNumber} at ${headSha} (deployment ${deployment.id}).`,
            )

  build:
    needs: approval-gate
    if: needs.approval-gate.outputs.deployment_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    cache-mode: read
    concurrency:
      group: requested-preview-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # Isolated build job: no secrets, no environment, read-only cache, read-only token.
      # Requires opt-in because actions/checkout@v6 blocks fork PR SHAs under pull_request_target.
      - name: Checkout approved commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Verify checked-out commit
        run: |
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$HEAD_SHA" ]]; then
            echo "::error::Checked-out commit $actual does not match approved SHA $HEAD_SHA."
            exit 1
          fi
          if [[ ! -f apps/web/scripts/build-preview.ts ]]; then
            echo "::error::apps/web/scripts/build-preview.ts is missing on this branch. Merge main into the PR branch and approve the new deployment."
            exit 1
          fi

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Restore API reference snapshot
        id: api-reference-snapshot
        uses: ./.github/actions/restore-api-reference-snapshot
        with:
          match-generator: true

      - name: Prepare API reference
        if: steps.api-reference-snapshot.outputs.restored != 'true'
        uses: ./.github/actions/prepare-api-reference
        with:
          cache: true

      - name: Name Astro incremental build cache
        id: astro-cache
        env:
          SNAPSHOT: ${{ steps.api-reference-snapshot.outputs.restored == 'true' && steps.api-reference-snapshot.outputs.tag || 'generated' }}
        run: echo "prefix=astro-incremental-$RUNNER_OS-$SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Restore Astro incremental build cache
        uses: actions/cache/restore@v5
        with:
          path: apps/web/.astro-cache
          key: ${{ steps.astro-cache.outputs.prefix }}-main-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            ${{ steps.astro-cache.outputs.prefix }}-main-
            astro-incremental-${{ runner.os }}-

      - name: Build preview artifact
        run: node apps/web/scripts/build-preview.ts .requested-preview-artifact

      - name: Verify generated API reference links
        run: |
          if [[ -d .requested-preview-artifact/client/docs ]]; then
            node apps/web/scripts/verify-api-reference-links.mjs .requested-preview-artifact/client
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: requested-preview-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .requested-preview-artifact
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [approval-gate, build]
    if: always() && needs.approval-gate.outputs.deployment_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: requested-preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Checkout trusted main
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      # Inline fallback because "Report result" loads its script from the checkout.
      - name: Report checkout failure
        if: failure() && steps.checkout.outcome == 'failure'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ needs.approval-gate.outputs.deployment_id }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const shortSha = process.env.HEAD_SHA.slice(0, 7)
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: "failure",
              environment: "Requested Preview",
              log_url: runUrl,
              description: `Preview for ${shortSha} was not published: checkout of main failed`,
              auto_inactive: false,
            })
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `No preview was published for \`${shortSha}\` because the workflow could not check out \`main\`. See the [workflow run](${runUrl}).`,
            })

      - name: Check PR is still open
        id: pr-check
        if: needs.build.result == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
            })
            core.info(`PR #${pr.number} is ${pr.state}.`)
            core.setOutput("open", String(pr.state === "open"))

      - name: Download preview artifact
        if: steps.pr-check.outputs.open == 'true'
        uses: actions/download-artifact@v8
        with:
          name: requested-preview-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .requested-preview-artifact

      - name: Install dependencies
        if: steps.pr-check.outputs.open == 'true'
        uses: ./.github/actions/setup

      # stacks/preview.ts validates the artifact before Alchemy reads it.
      - name: Deploy Cloudflare requested preview
        id: deploy
        if: steps.pr-check.outputs.open == 'true'
        run: |
          stage=$(vp exec mixedbread preview-stage --pr "$PR_NUMBER")
          node stacks/deploy-preview.ts "$stage"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ARTIFACT_DIR: .requested-preview-artifact

      - name: Report result
        if: (success() || failure()) && steps.checkout.outcome == 'success'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_ID: ${{ needs.approval-gate.outputs.deployment_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          PR_OPEN: ${{ steps.pr-check.outputs.open }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const preview = require("./.github/scripts/requested-preview.cjs")({ github, context, core })
            await preview.reportPublish({
              prNumber: Number(process.env.PR_NUMBER),
              headSha: process.env.HEAD_SHA,
              deploymentId: Number(process.env.DEPLOYMENT_ID),
              buildResult: process.env.BUILD_RESULT,
              prOpen: process.env.PR_OPEN,
              previewUrl: process.env.PREVIEW_URL,
            })

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: requested-preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Check for requested preview deployments
        id: deployments
        uses: actions/github-script@v8
        with:
          script: |
            const preview = require("./.github/scripts/requested-preview.cjs")({ github, context, core })
            const ids = await preview.deploymentIds(Number(process.env.PR_NUMBER))
            core.info(`Found ${ids.length} requested preview deployment(s) for PR #${process.env.PR_NUMBER}.`)
            core.setOutput("ids", JSON.stringify(ids))

      - name: Install dependencies
        if: steps.deployments.outputs.ids != '[]'
        uses: ./.github/actions/setup

      - name: Destroy Cloudflare requested preview
        if: steps.deployments.outputs.ids != '[]'
        run: |
          stage=$(vp exec mixedbread preview-stage --pr "$PR_NUMBER")
          vp exec alchemy destroy stacks/preview.ts --stage "$stage" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deactivate GitHub deployments
        if: steps.deployments.outputs.ids != '[]'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_IDS: ${{ steps.deployments.outputs.ids }}
        with:
          script: |
            const preview = require("./.github/scripts/requested-preview.cjs")({ github, context, core })
            await preview.deactivate(
              JSON.parse(process.env.DEPLOYMENT_IDS),
              "Requested preview destroyed on PR close",
            )
