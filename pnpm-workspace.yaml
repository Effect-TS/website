packages:
  - apps/*
  - packages/*

patchedDependencies:
  astro-tweet@0.0.6: patches/astro-tweet.patch

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

allowBuilds:
  "@mixedbread/cli": true
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0"
  - "@effect/doctest@4.0.0"
  - "@effect/monaco-editor@0.0.3"
  - "@effect/platform-browser@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/platform-node@4.0.0"
  - effect@4.0.0
  - "@effect/sql-d1@4.0.0"
  - "@effect/sql-sqlite-do@4.0.0"
  - "@effect/vitest@4.0.0"
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.80"
  - "@alchemy.run/floci@2.0.0-beta.80"
  - "@alchemy.run/frontend-frameworks@2.0.0-beta.80"
  - "@alchemy.run/node-utils@2.0.0-beta.80"
  - "@distilled.cloud/acme@1.0.0-rc.13"
  - "@distilled.cloud/aws@1.0.0-rc.13"
  - "@distilled.cloud/axiom@1.0.0-rc.13"
  - "@distilled.cloud/cloudflare@1.0.0-rc.13"
  - "@distilled.cloud/core@1.0.0-rc.13"
  - "@distilled.cloud/doppler@1.0.0-rc.13"
  - "@distilled.cloud/fly-io@1.0.0-rc.13"
  - "@distilled.cloud/gcp@1.0.0-rc.13"
  - "@distilled.cloud/hetzner@1.0.0-rc.13"
  - "@distilled.cloud/infisical@1.0.0-rc.13"
  - "@distilled.cloud/neon@1.0.0-rc.13"
  - "@distilled.cloud/planetscale@1.0.0-rc.13"
  - "@distilled.cloud/prisma@1.0.0-rc.13"
  - "@distilled.cloud/railway@1.0.0-rc.13"
  - "@distilled.cloud/stripe@1.0.0-rc.13"
  - "@distilled.cloud/zerossl@1.0.0-rc.13"
  - alchemy@2.0.0-beta.80

catalogMode: manual

update:
  ignoreDeps:
    - typescript

catalog:
  "@cloudflare/puppeteer": ^1.3.0
  "@cloudflare/workers-types": 5.20260812.1
  "@resvg/resvg-wasm": ^2.6.2
  "@types/node": ^26.6.3
  mdast-util-find-and-replace: ^3.0.2
  satori: ^0.26.0
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

catalogs:
  alchemy:
    alchemy: 2.0.0-beta.80
    "@alchemy.run/frontend-frameworks": 2.0.0-beta.80
  effect:
    effect: 4.0.0
    "@effect/atom-react": 4.0.0
    "@effect/monaco-editor": ^0.0.3
    "@effect/platform-browser": 4.0.0
    "@effect/platform-node": 4.0.0
    "@effect/doctest": 4.0.0

overrides:
  "@effect/sql-d1": 4.0.0
  "@effect/sql-sqlite-do": 4.0.0
  "@effect/vitest": 4.0.0
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
