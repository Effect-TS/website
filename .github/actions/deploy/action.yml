name: Deploy
description: Deploys the website to production.
inputs:
  api-reference-snapshot:
    description: Exact API reference snapshot tag; latest published snapshot when omitted
    required: false
    default: ""
  mixedbread-scope:
    description: Mixedbread content scope to synchronize
    required: false
    default: markdown
  website-ref:
    description: Website Git revision associated with the deployment
    required: true
  mxbai-api-key:
    description: Mixedbread API key
    required: true
  mxbai-vector-store-id:
    description: Mixedbread vector store ID
    required: true
  vercel-org-id:
    description: Vercel organization ID
    required: true
  vercel-project-id:
    description: Vercel project ID
    required: true
  vercel-token:
    description: Vercel authentication token
    required: true

runs:
  using: composite
  steps:
    - name: Install dependencies
      uses: ./.github/actions/setup

    - name: Resolve API reference snapshot
      id: api-reference-snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REQUESTED_SNAPSHOT: ${{ inputs.api-reference-snapshot }}
      run: |
        snapshot="$REQUESTED_SNAPSHOT"
        if [[ -z "$snapshot" ]]; then
          snapshot=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | startswith("api-reference-")))] | sort_by(.published_at) | last | (.tag_name // "")')
        fi

        if [[ ! "$snapshot" =~ ^api-reference-[a-f0-9]{64}$ ]]; then
          echo "::error::No valid published API reference snapshot is available. Publish one with the API reference workflow before deploying."
          exit 1
        fi

        release=$(gh release view "$snapshot" --json isDraft,isPrerelease)
        if [[ "$(jq -r '.isDraft or .isPrerelease' <<<"$release")" == "true" ]]; then
          echo "::error::API reference snapshot must be a published, non-prerelease release: $snapshot"
          exit 1
        fi
        echo "tag=$snapshot" >> "$GITHUB_OUTPUT"

    - name: Restore API reference snapshot
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SNAPSHOT_TAG: ${{ steps.api-reference-snapshot.outputs.tag }}
      run: |
        snapshot_dir="$RUNNER_TEMP/api-reference-snapshot"
        mkdir -p "$snapshot_dir"
        gh release download "$SNAPSHOT_TAG" \
          --dir "$snapshot_dir" \
          --pattern api-reference.tar.gz \
          --pattern api-reference.sha256 \
          --pattern manifest.json

        expected=$(cut -d ' ' -f 1 "$snapshot_dir/api-reference.sha256")
        actual=$(sha256sum "$snapshot_dir/api-reference.tar.gz" | cut -d ' ' -f 1)
        if [[ "$actual" != "$expected" ]]; then
          echo "::error::API reference snapshot checksum mismatch: expected $expected, received $actual"
          exit 1
        fi

        rm -rf .data/api-reference
        mkdir -p .data
        tar -xzf "$snapshot_dir/api-reference.tar.gz" -C .data
        snapshot_id=$(node scripts/api-reference/snapshot.mjs validate \
          --data .data/api-reference \
          --manifest "$snapshot_dir/manifest.json")
        if [[ "$SNAPSHOT_TAG" != "api-reference-$snapshot_id" ]]; then
          echo "::error::API reference snapshot tag does not match its manifest"
          exit 1
        fi

    - name: Pull Vercel Environment Information
      shell: bash
      run: pnpm exec vercel pull --yes --environment=production --token="${{ inputs.vercel-token }}" --scope=effect-ts
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Build Project Artifacts
      shell: bash
      run: pnpm exec vercel build --prod --token="${{ inputs.vercel-token }}"
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Patch trailing-slash redirect into build output
      shell: bash
      run: node scripts/patch-vercel-trailing-slash.mjs

    - name: Deploy Project Artifacts to Vercel
      shell: bash
      run: pnpm exec vercel deploy --prebuilt --archive=tgz --prod --token="${{ inputs.vercel-token }}" --scope=effect-ts
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Synchronize Mixedbread production store
      shell: bash
      run: vp run mixedbread:index sync --scope "${{ inputs.mixedbread-scope }}" --sha "${{ inputs.website-ref }}"
      env:
        MXBAI_API_KEY: ${{ inputs.mxbai-api-key }}
        MXBAI_VECTOR_STORE_ID: ${{ inputs.mxbai-vector-store-id }}
