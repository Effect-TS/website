packages:
  - apps/*
  - packages/*

patchedDependencies:
  "@distilled.cloud/railway@1.0.0-rc.9": patches/@distilled.cloud__railway@1.0.0-rc.9.patch
  "@distilled.cloud/planetscale@1.0.0-rc.9": patches/@distilled.cloud__planetscale@1.0.0-rc.9.patch
  "@distilled.cloud/hetzner@1.0.0-rc.9": patches/@distilled.cloud__hetzner@1.0.0-rc.9.patch
  "@distilled.cloud/fly-io@1.0.0-rc.9": patches/@distilled.cloud__fly-io@1.0.0-rc.9.patch
  "@distilled.cloud/axiom@1.0.0-rc.9": patches/@distilled.cloud__axiom@1.0.0-rc.9.patch
  "@distilled.cloud/core@1.0.0-rc.9": patches/@distilled.cloud__core@1.0.0-rc.9.patch
  "@distilled.cloud/cloudflare@1.0.0-rc.9": patches/@distilled.cloud__cloudflare@1.0.0-rc.9.patch
  "@distilled.cloud/aws@1.0.0-rc.9": patches/@distilled.cloud__aws@1.0.0-rc.9.patch
  alchemy@2.0.0-beta.77: patches/alchemy@2.0.0-beta.77.patch
  astro-tweet@0.0.6: patches/astro-tweet.patch
  "@alchemy.run/cloudflare-runtime@2.0.0-beta.77": patches/@alchemy.run__cloudflare-runtime@2.0.0-beta.77.patch

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

allowBuilds:
  "@mixedbread/cli": true
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-rc.115"
  - "@effect/doctest@4.0.0-rc.115"
  - "@effect/monaco-editor@0.0.3"
  - "@effect/platform-browser@4.0.0-rc.115"
  - "@effect/platform-node-shared@4.0.0-rc.115"
  - "@effect/platform-node@4.0.0-rc.115"
  - effect@4.0.0-rc.115

catalogMode: manual

update:
  ignoreDeps:
    - typescript

catalog:
  "@cloudflare/puppeteer": ^1.3.0
  "@cloudflare/workers-types": 5.20260812.1
  "@resvg/resvg-wasm": ^2.6.2
  "@types/node": ^26.4.1
  mdast-util-find-and-replace: ^3.0.2
  satori: ^0.26.0
  typescript: 6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8

catalogs:
  alchemy:
    alchemy: 2.0.0-beta.77
    "@alchemy.run/frontend-frameworks": 2.0.0-beta.77
  effect:
    effect: 4.0.0-rc.115
    "@effect/atom-react": 4.0.0-rc.115
    "@effect/monaco-editor": ^0.0.3
    "@effect/platform-browser": 4.0.0-rc.115
    "@effect/platform-node": 4.0.0-rc.115
    "@effect/doctest": 4.0.0-rc.115

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
