packages:
  - apps/*
  - packages/*

patchedDependencies:
  "@alchemy.run/cloudflare-frameworks@2.0.0-beta.72": patches/@alchemy.run__cloudflare-frameworks@2.0.0-beta.72.patch
  alchemy@2.0.0-beta.72: patches/alchemy@2.0.0-beta.72.patch
  astro-tweet@0.0.6: patches/astro-tweet.patch

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

allowBuilds:
  "@mixedbread/cli": true
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-rc.108"
  - "@effect/platform-browser@4.0.0-rc.108"
  - "@effect/platform-node-shared@4.0.0-rc.108"
  - "@effect/platform-node@4.0.0-rc.108"
  - effect@4.0.0-rc.108
  - "@effect/doctest@4.0.0-rc.108"

catalogMode: manual

catalog:
  "@types/node": 26.2.0
  "@cloudflare/puppeteer": ^1.3.0
  "@cloudflare/workers-types": 5.20260812.1
  "@resvg/resvg-wasm": ^2.6.2
  mdast-util-find-and-replace: ^3.0.2
  satori: ^0.26.0
  vite: 8.2.1
  vite-plus: 0.2.9

catalogs:
  alchemy:
    alchemy: 2.0.0-beta.72
    "@alchemy.run/cloudflare-frameworks": 2.0.0-beta.72
  effect:
    effect: 4.0.0-rc.108
    "@effect/atom-react": 4.0.0-rc.108
    "@effect/platform-browser": 4.0.0-rc.108
    "@effect/platform-node": 4.0.0-rc.108
    "@effect/doctest": 4.0.0-rc.108

overrides:
  "@effect/monaco-editor": link:../monaco-editor/out/monaco-editor
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
