name: Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - run: vp run check

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A cold tsrs-lsp-wasm build takes about 5 minutes; cached runs skip it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      # The tsrs-lsp-wasm and Scratchpad worker integration tests skip without it.
      - name: Build tsrs-lsp-wasm
        uses: ./.github/actions/tsrs-lsp-wasm
      - run: vp test

  scratchpad-e2e:
    name: Scratchpad E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Build tsrs-lsp-wasm
        uses: ./.github/actions/tsrs-lsp-wasm
      - name: Install Playwright Chromium
        run: vp exec playwright install --with-deps chromium
      - name: Run Scratchpad E2E
        run: vp run test:e2e:scratchpad-worker

  # The Scratchpad against a real WebContainer. Non-blocking until its
  # flakiness is known: it needs StackBlitz and the npm registry, and a failure
  # here doesn't fail the workflow. To make it gating, drop
  # `continue-on-error` and add the job to the branch protection's required
  # checks (see .scratch/webcontainer-execution/issues/13-real-container-e2e.md).
  scratchpad-container-e2e:
    name: Scratchpad Container E2E
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Build tsrs-lsp-wasm
        uses: ./.github/actions/tsrs-lsp-wasm
      - name: Install Playwright Chromium
        run: vp exec playwright install --with-deps chromium
      - name: Run Scratchpad Container E2E
        run: vp run test:e2e:scratchpad-container
        env:
          SCRATCHPAD_CONTAINER_RETRIES: "2"
      # Failed attempts keep their traces, including ones a retry passed, so
      # flaky runs leave evidence too.
      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scratchpad-container-e2e-traces
          path: test-results/scratchpad-container/
          if-no-files-found: ignore
          retention-days: 14
