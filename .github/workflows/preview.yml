name: Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  authorize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Check PR author repository permission
        id: permission
        uses: actions/github-script@v8
        with:
          script: |
            // Preserve the existing trust exception for the Janitor app's immutable ID.
            if (context.payload.pull_request.user.id === 349016676) {
              core.setOutput("allowed", "true")
              return
            }
            let permission = "none"
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: context.payload.pull_request.user.login,
              })
              permission = data.permission
            } catch (error) {
              if (error.status !== 404) throw error
            }
            const allowed = ["write", "maintain", "admin"].includes(permission)
            core.setOutput("allowed", String(allowed))
            core.info(`PR author repository permission: ${permission}; preview allowed: ${allowed}`)

  deploy:
    needs: authorize
    if: github.event.action != 'closed' && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Detect search index changes
        id: search-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(vp exec mixedbread search-changes --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Pull requests that leave the generator alone preview the same API
      # reference production serves, without generating it.
      - name: Restore API reference snapshot
        id: api-reference-snapshot
        uses: ./.github/actions/restore-api-reference-snapshot
        with:
          match-generator: true

      - name: Prepare API reference
        if: steps.api-reference-snapshot.outputs.restored != 'true'
        uses: ./.github/actions/prepare-api-reference
        with:
          cache: true

      - name: Restore Astro incremental build cache
        uses: actions/cache/restore@v5
        with:
          path: apps/web/.astro-cache
          key: astro-incremental-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            astro-incremental-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-
            astro-incremental-${{ runner.os }}-main-

      - name: Write public build inputs
        run: node apps/web/scripts/write-alchemy-build-input.mjs
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_API_HOST: ${{ vars.PUBLIC_POSTHOG_API_HOST }}

      - name: Deploy Cloudflare preview
        run: |
          stage=$(vp exec mixedbread preview-stage --pr "$PULL_REQUEST")
          vp exec alchemy deploy --stage "$stage" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MXBAI_ADMIN_API_KEY: ${{ secrets.MXBAI_PREVIEW_ADMIN_API_KEY }}
          MXBAI_API_KEY: ${{ secrets.MXBAI_SEARCH_API_KEY }}
          MXBAI_PREVIEW_SEARCH_API_KEY: ${{ secrets.MXBAI_PREVIEW_SEARCH_API_KEY }}
          MXBAI_VECTOR_STORE_ID: ${{ secrets.MXBAI_VECTOR_STORE_ID }}
          MXBAI_PREVIEW_STORE_ENABLED: ${{ steps.search-changes.outputs.changed }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_API_HOST: ${{ vars.PUBLIC_POSTHOG_API_HOST }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          WEBSITE_REVISION: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated API reference links
        run: |
          if [[ -d apps/web/dist/client/docs ]]; then
            node apps/web/scripts/verify-api-reference-links.mjs apps/web/dist/client
          else
            echo "Alchemy reused the unchanged deployment; no local build output to verify."
          fi

      - name: Save Astro incremental build cache
        if: success() && hashFiles('apps/web/.astro-cache/incremental-build.json') != ''
        uses: actions/cache/save@v5
        with:
          path: apps/web/.astro-cache
          key: astro-incremental-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

  cleanup:
    needs: authorize
    if: github.event.action == 'closed' && needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.base.sha }}

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Destroy Cloudflare preview
        run: |
          stage=$(vp exec mixedbread preview-stage --pr "$PR_NUMBER")
          vp exec alchemy destroy --stage "$stage" --yes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MXBAI_ADMIN_API_KEY: ${{ secrets.MXBAI_PREVIEW_ADMIN_API_KEY }}
          MXBAI_API_KEY: ${{ secrets.MXBAI_SEARCH_API_KEY }}
          MXBAI_VECTOR_STORE_ID: ${{ secrets.MXBAI_VECTOR_STORE_ID }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          WEBSITE_REVISION: ${{ github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
