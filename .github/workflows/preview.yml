name: Preview Deployment
# The commit a reviewer approves, shown in the run list and the approval dialog.
run-name: "Preview PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"

# Runs from main's copy of this file, so a pull request cannot change it.
# Same-repo pull requests from authors with write access deploy automatically.
# Any other pull request (forks included) waits for a reviewer of the `fork`
# environment to approve its exact head commit under "Review deployments".
# Approved code, including its local actions and alchemy.run.ts, runs with the
# deploy secrets, so review the diff first. A new push or closing the pull
# request cancels this run (see `concurrency`), and the new run needs a new
# approval.
# No branch filter, so cleanup also runs when a pull request is closed after
# being retargeted away from main. Only pull requests to main deploy.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  authorize:
    if: github.event.action != 'closed' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # `trusted` deploys now, `fork` waits for approval, empty skips the deploy.
    outputs:
      mode: ${{ steps.permission.outputs.mode }}
    steps:
      - name: Check PR author repository permission
        id: permission
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request
            const trusted = async () => {
              if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return false
              // Preserve the existing trust exception for the Janitor app's immutable ID.
              if (pr.user.id === 349016676) return true
              let permission = "none"
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo,
                  username: pr.user.login,
                })
                permission = data.permission
              } catch (error) {
                if (error.status !== 404) throw error
              }
              core.info(`PR author repository permission: ${permission}`)
              return ["write", "maintain", "admin"].includes(permission)
            }
            if (await trusted()) {
              core.setOutput("mode", "trusted")
              return
            }
            // GitHub creates a missing environment without reviewers, and an
            // environment without reviewers does not pause the job, so only
            // wait on `fork` while it has required reviewers.
            let environment
            try {
              ;({ data: environment } = await github.rest.repos.getEnvironment({
                ...context.repo,
                environment_name: "fork",
              }))
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (!environment?.protection_rules?.some((rule) => rule.type === "required_reviewers" && rule.reviewers?.length)) {
              core.warning('Environment "fork" is missing or has no required reviewers; skipping the preview.')
              return
            }
            core.setOutput("mode", "fork")
            core.info(`PR #${pr.number} at ${pr.head.sha} is waiting for approval on environment "fork".`)

  deploy:
    name: "Deploy PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"
    needs: authorize
    if: github.event.action != 'closed' && needs.authorize.outputs.mode != ''
    environment: ${{ needs.authorize.outputs.mode == 'fork' && 'fork' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # Runs before any pull request code. A rerun reuses the `mode` from
      # `authorize`, and retargeting or rerunning after close starts no new run,
      # so check the live pull request and, for `fork`, that a reviewer approved
      # this run, instead of trusting earlier results.
      - name: Check pull request state and approval
        uses: actions/github-script@v8
        env:
          MODE: ${{ needs.authorize.outputs.mode }}
        with:
          script: |
            const event = context.payload.pull_request
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: event.number })
            if (pr.state !== "open" || pr.base.ref !== "main" || pr.head.sha !== event.head.sha) {
              core.setFailed(`PR #${event.number} is no longer open on main at ${event.head.sha}; not deploying.`)
              return
            }
            if (process.env.MODE !== "fork") return
            const { data: reviews } = await github.rest.actions.getReviewsForRun({ ...context.repo, run_id: context.runId })
            const fork = reviews.filter((review) => review.environments.some((environment) => environment.name === "fork"))
            if (!fork.length || !fork.every((review) => review.state === "approved")) {
              core.setFailed('This run has no approval for environment "fork"; not deploying.')
            }

      # The event's head SHA, never the live head, so the approved commit is the
      # one that runs. Fork checkout is opt-in under pull_request_target.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Detect search index changes
        id: search-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(vp exec mixedbread search-changes --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Pull requests that leave the generator alone preview the same API
      # reference production serves, without generating it.
      - name: Restore API reference snapshot
        id: api-reference-snapshot
        uses: ./.github/actions/restore-api-reference-snapshot
        with:
          match-generator: true

      - name: Prepare API reference
        if: steps.api-reference-snapshot.outputs.restored != 'true'
        uses: ./.github/actions/prepare-api-reference
        with:
          cache: true

      # Caches are keyed by the API reference data first: the restored
      # snapshot, or `generated` when this pull request generated its own.
      - name: Name Astro incremental build cache
        id: astro-cache
        env:
          SNAPSHOT: ${{ steps.api-reference-snapshot.outputs.restored == 'true' && steps.api-reference-snapshot.outputs.tag || 'generated' }}
        run: echo "prefix=astro-incremental-$RUNNER_OS-$SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Restore Astro incremental build cache
        uses: actions/cache/restore@v5
        with:
          path: apps/web/.astro-cache
          key: ${{ steps.astro-cache.outputs.prefix }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            ${{ steps.astro-cache.outputs.prefix }}-pr-${{ github.event.pull_request.number }}-
            ${{ steps.astro-cache.outputs.prefix }}-main-
            astro-incremental-${{ runner.os }}-

      - name: Write public build inputs
        run: node apps/web/scripts/write-alchemy-build-input.mjs
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_API_HOST: ${{ vars.PUBLIC_POSTHOG_API_HOST }}

      - name: Deploy Cloudflare preview
        run: |
          stage=$(vp exec mixedbread preview-stage --pr "$PULL_REQUEST")
          vp exec alchemy deploy --stage "$stage" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MXBAI_ADMIN_API_KEY: ${{ secrets.MXBAI_PREVIEW_ADMIN_API_KEY }}
          MXBAI_API_KEY: ${{ secrets.MXBAI_SEARCH_API_KEY }}
          MXBAI_PREVIEW_SEARCH_API_KEY: ${{ secrets.MXBAI_PREVIEW_SEARCH_API_KEY }}
          MXBAI_VECTOR_STORE_ID: ${{ secrets.MXBAI_VECTOR_STORE_ID }}
          MXBAI_PREVIEW_STORE_ENABLED: ${{ steps.search-changes.outputs.changed }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_API_HOST: ${{ vars.PUBLIC_POSTHOG_API_HOST }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          WEBSITE_REVISION: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated API reference links
        id: verify-links
        run: |
          if [[ -d apps/web/dist/client/docs ]]; then
            node apps/web/scripts/verify-api-reference-links.mjs apps/web/dist/client
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Alchemy reused the unchanged deployment; no local build output to verify."
          fi

      # Without a build, the cache directory is still the one restored above,
      # which may belong to another snapshot. Caches saved here land in main's
      # scope, where production can restore them, so approved fork code skips it.
      - name: Save Astro incremental build cache
        if: success() && needs.authorize.outputs.mode == 'trusted' && steps.verify-links.outputs.built == 'true' && hashFiles('apps/web/.astro-cache/incremental-build.json') != ''
        uses: actions/cache/save@v5
        with:
          path: apps/web/.astro-cache
          key: ${{ steps.astro-cache.outputs.prefix }}-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

  # Checks out main, never the pull request, so it needs no approval.
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # By branch name: the guard in actions/checkout refuses a fork's merge SHA.
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Destroy Cloudflare preview
        run: |
          stage=$(vp exec mixedbread preview-stage --pr "$PR_NUMBER")
          vp exec alchemy destroy --stage "$stage" --yes
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MXBAI_ADMIN_API_KEY: ${{ secrets.MXBAI_PREVIEW_ADMIN_API_KEY }}
          MXBAI_API_KEY: ${{ secrets.MXBAI_SEARCH_API_KEY }}
          MXBAI_VECTOR_STORE_ID: ${{ secrets.MXBAI_VECTOR_STORE_ID }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          WEBSITE_REVISION: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
