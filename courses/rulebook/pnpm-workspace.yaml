# Standalone project: this file makes courses/rulebook its own pnpm root,
# separate from the website workspace.
packages:
  - .

allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.1.1"
  - "@effect/platform-node@4.1.1"
  - "@effect/sql-sqlite-node@4.1.1"
  - "@effect/vitest@4.1.1"
  - effect@4.1.1
