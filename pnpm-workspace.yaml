packages:
  - apps/*
  - packages/*

patchedDependencies:
  astro-tweet@0.0.6: patches/astro-tweet.patch

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

allowBuilds:
  "@mixedbread/cli": true
  esbuild: false
  msgpackr-extract: false
  msw: false
  sharp: false

minimumReleaseAgeExclude:
  - "@effect/atom-react@4.0.0-rc.108"
  - "@effect/platform-browser@4.0.0-rc.108"
  - "@effect/platform-node-shared@4.0.0-rc.108"
  - "@effect/platform-node@4.0.0-rc.108"
  - effect@4.0.0-rc.108
  - "@effect/doctest@4.0.0-rc.108"

catalogMode: manual

update:
  ignoreDeps:
    - typescript

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  typescript: 6.0.3
  "@types/node": ^26.4.1

catalogs:
  effect:
    effect: 4.0.0-rc.108
    "@effect/atom-react": 4.0.0-rc.108
    "@effect/platform-browser": 4.0.0-rc.108
    "@effect/platform-node": 4.0.0-rc.108
    "@effect/doctest": 4.0.0-rc.108

overrides:
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
