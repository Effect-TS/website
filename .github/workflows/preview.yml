name: GitHub Actions Vercel Preview Deployment

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Checkout Effect
        uses: actions/checkout@v6
        with:
          repository: Effect-TS/effect
          ref: 52838418db2e04db6aaed2fa01b280f2aad4032a
          path: .effect-source
          fetch-depth: 1

      - name: Generate API reference
        run: pnpm api-reference:generate --version v4 --repo .effect-source

      - name: Synchronize Mixedbread preview store
        id: mixedbread
        run: pnpm mixedbread:index sync --pr "${{ github.event.pull_request.number }}" --sha "${{ github.event.pull_request.head.sha }}"
        env:
          MXBAI_API_KEY: ${{ secrets.MXBAI_PREVIEW_ADMIN_API_KEY }}

      - name: Pull Vercel Environment Information
        run: pnpm exec vercel pull --yes --environment=preview --git-branch="${{ github.head_ref }}" --token=${{ secrets.VERCEL_TOKEN }} --scope=effect-ts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: pnpm exec vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Patch trailing-slash redirect into build output
        run: node scripts/patch-vercel-trailing-slash.mjs

      - name: Deploy Project Artifacts to Vercel
        run: pnpm exec vercel deploy --prebuilt --env="MXBAI_VECTOR_STORE_ID=${{ steps.mixedbread.outputs.store_id }}" --token=${{ secrets.VERCEL_TOKEN }} --scope=effect-ts
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Delete Mixedbread preview store
        run: pnpm mixedbread:index delete-preview --pr "${{ github.event.pull_request.number }}"
        env:
          MXBAI_API_KEY: ${{ secrets.MXBAI_PREVIEW_ADMIN_API_KEY }}
