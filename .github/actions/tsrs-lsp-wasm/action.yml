name: Build tsrs-lsp-wasm
description: >-
  Builds the Scratchpad's in-browser language server into
  packages/tsrs-lsp-wasm/dist (the wasm module and its licenses). The Scratchpad
  gets types from the Container's installed packages, not a bundled pack. The
  wasm module is cached on the package's build inputs, so
  only a change to the pins, patches, crate or build script rebuilds it.
  Run after ./.github/actions/setup.

runs:
  using: composite
  steps:
    - name: Restore tsrs-lsp-wasm module
      id: cache
      uses: actions/cache@v5
      with:
        path: |
          packages/tsrs-lsp-wasm/dist/tsrs-effect-lsp.wasm
          packages/tsrs-lsp-wasm/dist/licenses
          packages/tsrs-lsp-wasm/dist/manifest.json
        key: tsrs-lsp-wasm-${{ runner.os }}-${{ hashFiles('packages/tsrs-lsp-wasm/upstream/**', 'packages/tsrs-lsp-wasm/scripts/build-wasm.ts', 'packages/tsrs-lsp-wasm/scripts/manifest.ts') }}

    # Keep in sync with packages/tsrs-lsp-wasm/upstream/pins.json and flake.nix.
    - name: Install Rust and the wasm32-wasip1 target
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        toolchain=$(jq -r .rust.toolchain packages/tsrs-lsp-wasm/upstream/pins.json)
        target=$(jq -r .rust.target packages/tsrs-lsp-wasm/upstream/pins.json)
        rustup toolchain install "$toolchain" --profile minimal --target "$target"

    # Ubuntu's binaryen lags the wasm features rustc emits; use a release build.
    - name: Install binaryen
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BINARYEN_VERSION: "132"
      run: |
        dir="$RUNNER_TEMP/binaryen"
        mkdir -p "$dir"
        curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
          | tar -xz -C "$dir" --strip-components=1
        echo "$dir/bin" >> "$GITHUB_PATH"

    - name: Build tsrs-lsp-wasm module
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @website/tsrs-lsp-wasm build:wasm
