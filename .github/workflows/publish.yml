name: Publish

on:
  repository_dispatch:
    types: [publish-api-reference]
  workflow_dispatch:
    inputs:
      v3_revision:
        description: Full Effect Git commit SHA for the v3 channel
        required: true
        type: string
      v4_revision:
        description: Full Effect Git commit SHA for the v4 channel
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-api-reference
  cancel-in-progress: false

jobs:
  resolve-snapshot:
    runs-on: ubuntu-latest
    outputs:
      snapshot_tag: ${{ steps.snapshot.outputs.tag }}
      snapshot_id: ${{ steps.snapshot.outputs.id }}
      generator: ${{ steps.snapshot.outputs.generator }}
      published: ${{ steps.snapshot.outputs.published }}
      v3_revision: ${{ steps.snapshot.outputs.v3 }}
      v4_revision: ${{ steps.snapshot.outputs.v4 }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Prepare snapshot
        id: snapshot
        env:
          EVENT_CHANNEL: ${{ github.event.client_payload.channel }}
          EVENT_REPOSITORY: ${{ github.event.client_payload.repository }}
          EVENT_REVISION: ${{ github.event.client_payload.revision }}
          GH_TOKEN: ${{ github.token }}
          V3_REVISION: ${{ inputs.v3_revision }}
          V4_REVISION: ${{ inputs.v4_revision }}
        run: |
          vp exec api-reference snapshot prepare \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-repository "$EVENT_REPOSITORY" \
            --event-channel "$EVENT_CHANNEL" \
            --event-revision "$EVENT_REVISION" \
            --repository "$GITHUB_REPOSITORY" \
            --v3 "$V3_REVISION" \
            --v4 "$V4_REVISION" >> "$GITHUB_OUTPUT"

  publish-snapshot:
    needs: resolve-snapshot
    if: needs.resolve-snapshot.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Prepare API reference
        uses: ./.github/actions/prepare-api-reference
        with:
          v3-revision: ${{ needs.resolve-snapshot.outputs.v3_revision }}
          v4-revision: ${{ needs.resolve-snapshot.outputs.v4_revision }}

      - name: Package API reference snapshot
        env:
          GENERATOR_HASH: ${{ needs.resolve-snapshot.outputs.generator }}
          SNAPSHOT_ID: ${{ needs.resolve-snapshot.outputs.snapshot_id }}
          V3_REVISION: ${{ needs.resolve-snapshot.outputs.v3_revision }}
          V4_REVISION: ${{ needs.resolve-snapshot.outputs.v4_revision }}
        run: |
          vp exec api-reference snapshot package \
            --data apps/web/.data/api-reference \
            --output "$RUNNER_TEMP/api-reference-assets" \
            --v3 "$V3_REVISION" \
            --v4 "$V4_REVISION" \
            --generator "$GENERATOR_HASH" \
            --website-revision "$GITHUB_SHA" \
            --expected-id "$SNAPSHOT_ID"

      - name: Publish API reference snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          V3_REVISION: ${{ needs.resolve-snapshot.outputs.v3_revision }}
          V4_REVISION: ${{ needs.resolve-snapshot.outputs.v4_revision }}
          GENERATOR_HASH: ${{ needs.resolve-snapshot.outputs.generator }}
          SNAPSHOT_ID: ${{ needs.resolve-snapshot.outputs.snapshot_id }}
        run: |
          vp exec api-reference snapshot publish \
            --repository "$GITHUB_REPOSITORY" \
            --assets "$RUNNER_TEMP/api-reference-assets" \
            --v3 "$V3_REVISION" \
            --v4 "$V4_REVISION" \
            --generator "$GENERATOR_HASH" \
            --expected-id "$SNAPSHOT_ID"

  resolve-website-revision:
    needs: [resolve-snapshot, publish-snapshot]
    if: always() && needs.resolve-snapshot.result == 'success' && (needs.publish-snapshot.result == 'success' || needs.publish-snapshot.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.revision.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: revision
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy-production:
    needs: [resolve-snapshot, resolve-website-revision]
    uses: ./.github/workflows/deploy.yml
    with:
      website-ref: ${{ needs.resolve-website-revision.outputs.revision }}
      api-reference-snapshot: ${{ needs.resolve-snapshot.outputs.snapshot_tag }}
      mixedbread-scope: api-reference
      cloudflare-traffic-mode: ${{ vars.CLOUDFLARE_TRAFFIC_MODE || 'workers-dev' }}
    secrets: inherit
